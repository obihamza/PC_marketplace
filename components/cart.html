<div id="cartOverlay" class="cart-overlay"></div>

<aside id="shoppingCart" class="shopping-cart" aria-hidden="true" aria-label="Shopping cart">
    <div class="cart-header">
        <h2>Shopping Cart</h2>
        <button id="closeCart" class="cart-close" type="button" aria-label="Close cart">
            <span class="material-symbols-rounded">close</span>
        </button>
    </div>

    <div id="cartItems" class="cart-items">
        <p class="cart-empty">Your cart is empty.</p>
    </div>

    <div class="cart-footer">
        <p class="cart-total-row">Total: <strong id="cartTotal">0 JOD</strong></p>
        <button id="checkoutButton" type="button">Checkout</button>
    </div>
</aside>
