<aside class="chat-panel" id="chatPanel" aria-hidden="true">
            <div class="chat-header">
                <div class="chat-header-info">
                    <span class="material-symbols-rounded">support_agent</span>
                    <div>
                        <h2>PC Market Assistant</h2>
                        <p>Here to help you</p>
                    </div>
                </div>

                <button type="button" class="chat-close" id="chatClose"
                    aria-label="Close chat">
                    <span class="material-symbols-rounded">close</span>
                </button>
            </div>

            <div class="chat-messages" id="chat-messages">
                <div class="bot-message">
                    Hi! 👋 Welcome to PC Market Jordan.
                    How can I help you find the right PC hardware?
                </div>
            </div>

            <form class="chat-input-area" id="chatForm">
                <input
                    type="text"
                    id="chat-input"
                    placeholder="Ask here..."
                    aria-label="Message"
                    required
                >

                <button type="submit" aria-label="Send message" id="chat-submit-btn">
                    <span class="material-symbols-rounded">send</span>
                </button>
            </form>
        </aside>
